name: Stale Issues & PRs

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale issues and PRs
    runs-on: ubuntu-latest

    steps:
      - name: Stale issues
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity in the last 30 days. It will be closed in 7 days if no
            further activity occurs.

            If this is still relevant, please leave a comment or remove the `stale` label.
          close-issue-message: >
            This issue was closed automatically because it has been stale for 7 days
            with no activity. Feel free to reopen if the issue is still relevant.
          close-issue-reason: not_planned

          # PRs
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity in the last 14 days. It will be closed in 7 days if no
            further activity occurs.

            If this PR is still in progress, please push a commit or remove the `stale` label.
          close-pr-message: >
            This pull request was closed automatically because it has been stale for 7 days
            with no activity. Feel free to reopen if you would like to continue working on it.

          # Exempt labels — issues/PRs with these labels are never marked stale
          exempt-issue-labels: "pinned,security,bug,enhancement,help wanted"
          exempt-pr-labels: "pinned,security,work-in-progress,do-not-merge"

          # Only process a limited number per run to avoid rate limits
          operations-per-run: 100
